name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dev dependencies
        run: pip install ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: pip install ".[dev]"
      - name: Run tests
        run: pytest
      - name: Coverage gate (wizard generators)
        # Per-module floor on `hoi4cm.wizards._generators` keeps new
        # script/loc extractions tested (see docs/dev/wizards.md).
        run: >
          pytest tests/test_wizard_generators_*.py
          --cov=hoi4cm.wizards._generators
          --cov-fail-under=70
          --cov-report=term-missing
