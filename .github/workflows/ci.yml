name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# Least privilege: read by default. Only `release`, the one job gated on a v*
# tag, gets write. Everything before it, including the build that runs arbitrary
# project build code across three runners, stays read-only.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        # v6.3.0
        with:
          python-version: "3.14"
      - name: Install dev dependencies
        run: pip install ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Mypy
        run: mypy
      - name: Pylint
        run: pylint src/hoi4cm tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    env:
      # Turns "no display" from a silent skip into a failure, so a broken
      # Xvfb can't quietly drop every widget test (tests/conftest.py).
      HOI4CM_REQUIRE_TK: "1"
      # The test guard fails if CI did not install the lock's exact Pillow pin.
      HOI4CM_REQUIRE_PINNED_PILLOW: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: |
          # Reuse the build lock's exact Pillow pin without duplicating it here.
          pillow_lines="$(grep '^pillow==' build/requirements.txt || true)"
          pillow_count="$(
            printf '%s\n' "$pillow_lines" | grep -c '^pillow==' || true
          )"
          test "$pillow_count" -eq 1
          pillow_line="$pillow_lines"
          printf '%s\n' "$pillow_line" | grep -Eq \
            '^pillow==[0-9]+\.[0-9]+\.[0-9]+ \\$'
          pillow_version="${pillow_line#pillow==}"
          pillow_version="${pillow_version% \\}"
          test -n "$pillow_version"
          pip install ".[dev]" "Pillow==$pillow_version"
      - name: Run tests
        # Xvfb gives the Tk widget tests a display; without it they skip.
        # Coverage sources in pyproject.toml include both hoi4cm and the
        # root-level monolith; gate them independently below.
        run: >
          xvfb-run -a pytest
          --cov
          --cov-report=term-missing
      - name: Coverage gate (hoi4cm package)
        # Ratchet one point below the current measured 68% package coverage.
        run: coverage report --include='src/hoi4cm/*' --fail-under=67
      - name: Coverage gate (monolith)
        # Independent floor: the 31% baseline is lower, but keeps existing
        # shell seams covered while the monolith migration continues.
        run: coverage report --include='hoi4_content_maker.py' --fail-under=30
      - name: Coverage gate (wizard generators)
        # Per-module floor on `hoi4cm.wizards._generators` keeps new
        # script/loc extractions tested (see docs/dev/wizards.md). No Xvfb
        # here on purpose: these tests must stay headless.
        run: >
          pytest tests/test_wizard_generators_*.py
          --cov=hoi4cm.wizards._generators
          --cov-fail-under=95
          --cov-report=term-missing

  # Runs on every push and PR, not just tags, so a PyInstaller break shows up
  # in the PR that caused it instead of at tag time.
  build:
    needs: [lint, test]
    permissions:
      contents: read
    strategy:
      # One platform breaking shouldn't hide whether the other two are fine.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: HOI4ContentMaker.exe
          - os: macos-latest
            artifact_name: HOI4ContentMaker-mac
          - os: ubuntu-latest
            artifact_name: HOI4ContentMaker-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        # v6.3.0
        with:
          python-version: "3.14"

      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth

      - name: Install build dependencies
        # Hash-pinned closure of the `build` extra (build/requirements.txt).
        # The project itself is not installed: build.py hands PyInstaller
        # `pathex=[root, src]`, so hoi4cm resolves from the checkout.
        run: pip install --require-hashes -r build/requirements.txt

      - name: Build executable
        run: python build/build.py

      - name: Make executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x "${{ matrix.artifact_name }}"

      - name: Smoke-test executable
        run: >
          python -c "import os, subprocess, sys;
          command = [os.path.abspath('${{ matrix.artifact_name }}'), '--smoke-test'];
          command = ['xvfb-run', '-a', *command] if sys.platform == 'linux' else command;
          subprocess.run(command, check=True, timeout=60)"

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        # v5.0.0
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    needs: build
    # `-pre.` tags belong to pre-release.yml, which publishes them itself. They
    # are skipped here so a pre-release can never go out as a full release.
    if: >
      startsWith(github.ref, 'refs/tags/v')
      && !contains(github.ref_name, '-pre.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        # v6.3.0
        with:
          python-version: "3.14"

      # Releases live on the even minors; the odd minor above each one is the
      # pre-release line. Fail rather than publish a hand-pushed tag that lands
      # on it.
      - name: Check the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/versioning.py check-release-tag "$RELEASE_TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        # v6.0.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksum the binaries
        working-directory: artifacts
        run: >
          sha256sum HOI4ContentMaker.exe HOI4ContentMaker-mac
          HOI4ContentMaker-linux > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            artifacts/HOI4ContentMaker.exe \
            artifacts/HOI4ContentMaker-mac \
            artifacts/HOI4ContentMaker-linux \
            artifacts/SHA256SUMS.txt \
            --title "HOI4 Content Maker $RELEASE_TAG" \
            --notes-file - <<EOF
          ## HOI4 Content Maker $RELEASE_TAG

          ### Downloads
          | Platform | File |
          |----------|------|
          | Windows | \`HOI4ContentMaker.exe\` |
          | macOS | \`HOI4ContentMaker-mac\` |
          | Linux | \`HOI4ContentMaker-linux\` |

          ### Running
          - **Windows**: Double-click \`HOI4ContentMaker.exe\`
          - **macOS**: \`chmod +x HOI4ContentMaker-mac &&
            ./HOI4ContentMaker-mac\`
          - **Linux**: \`chmod +x HOI4ContentMaker-linux &&
            ./HOI4ContentMaker-linux\`

          No Python installation required.

          ### Verifying
          \`SHA256SUMS.txt\` has the SHA-256 of each binary. Put it next to the
          download and check it:

          - **Linux**: \`sha256sum --ignore-missing -c SHA256SUMS.txt\`
          - **macOS**: \`shasum -a 256 -c SHA256SUMS.txt\` (it will
            complain about the two files you didn't download)
          - **Windows**: \`certutil -hashfile HOI4ContentMaker.exe SHA256\`,
            then compare against the matching line.
          EOF
