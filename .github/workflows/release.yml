name: Release

on:
  push:
    tags: ['v*']

# Least privilege: read by default. Only the release job that publishes needs
# write. The build job runs arbitrary project build code, so it stays read-only.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: HOI4ContentMaker.exe
            display_name: Windows
          - os: macos-latest
            artifact_name: HOI4ContentMaker-mac
            display_name: macOS
          - os: ubuntu-latest
            artifact_name: HOI4ContentMaker-linux
            display_name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'

      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install build dependencies
        run: pip install ".[build]"

      - name: Build executable
        run: python build/build.py

      - name: Make executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x "${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: HOI4 Content Maker ${{ github.ref_name }}
          body: |
            ## HOI4 Content Maker ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows | `HOI4ContentMaker.exe` |
            | macOS | `HOI4ContentMaker-mac` |
            | Linux | `HOI4ContentMaker-linux` |

            ### Running
            - **Windows**: Double-click `HOI4ContentMaker.exe`
            - **macOS**: `chmod +x HOI4ContentMaker-mac && ./HOI4ContentMaker-mac`
            - **Linux**: `chmod +x HOI4ContentMaker-linux && ./HOI4ContentMaker-linux`

            No Python installation required.
          files: |
            artifacts/HOI4ContentMaker.exe/HOI4ContentMaker.exe
            artifacts/HOI4ContentMaker-mac/HOI4ContentMaker-mac
            artifacts/HOI4ContentMaker-linux/HOI4ContentMaker-linux
          draft: false
          prerelease: false
