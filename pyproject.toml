[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hoi4cm"
version = "0.1.0"
description = "Content Maker for Hearts of Iron 4 — Millennium Dawn Team"
requires-python = ">=3.9"
# Runs on the stdlib + tkinter alone. Third-party deps are optional extras below.
dependencies = []

[project.optional-dependencies]
image = ["Pillow>=9.0"]                       # GFX icon previews (.png/.tga)
dev = ["pytest>=7.0"]                         # tests
build = ["pyinstaller>=6.0", "Pillow>=9.0"]   # compile standalone executables

[tool.hatch.build.targets.wheel]
packages = ["src/hoi4cm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
