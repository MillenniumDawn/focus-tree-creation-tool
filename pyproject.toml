[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hoi4cm"
version = "0.1.0"
description = "Content Maker for Hearts of Iron 4 — Millennium Dawn Team"
requires-python = ">=3.9"
# Runs on the stdlib + tkinter alone. Third-party deps are optional extras below.
dependencies = []

[project.optional-dependencies]
image = ["Pillow>=9.0"]                              # GFX icon previews (.png/.tga)
dev = ["pytest>=7.0", "ruff>=0.6", "black>=24.0"]    # tests + linting
build = ["pyinstaller>=6.0", "Pillow>=9.0"]          # compile standalone executables

[tool.hatch.build.targets.wheel]
packages = ["src/hoi4cm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Linting/formatting is scoped to the modular package + tests. The legacy
# monolith (hoi4_content_maker.py) and build scripts are excluded until they
# are refactored into the package.
[tool.black]
line-length = 88
target-version = ["py39"]
extend-exclude = "hoi4_content_maker\\.py|^/build/"

[tool.ruff]
line-length = 88
extend-exclude = ["hoi4_content_maker.py", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/hoi4cm/ui/effects_panel.py" = ["E501", "E741"]
"src/hoi4cm/ui/mod_loading.py" = ["E501"]
"src/hoi4cm/ui/canvas.py" = ["E501"]
