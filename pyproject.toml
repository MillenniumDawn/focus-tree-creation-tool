[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hoi4cm"
# Moved by scripts/release_pr.py when the release pull request is prepared, and
# the source of truth every other version source is written from. Do not bump
# by hand — add bullets under CHANGELOG.md's `## Unreleased` instead.
version = "0.4.4"
description = "Content Maker for Hearts of Iron 4 — Millennium Dawn Team"
requires-python = ">=3.14"
# Runs on the stdlib + tkinter alone. Third-party deps are optional extras below.
dependencies = []

[project.optional-dependencies]
image = ["Pillow>=9.0"] # GFX icon previews (.png/.tga)
# The Tk smoke needs matching Python Tk bindings, Xvfb, and xauth.
# Debian/Ubuntu: sudo apt-get install python3-tk xvfb xauth
# Non-default Python needs its matching Tk package (e.g. python3.14-tk).
# In a venv: python -m pip install --require-hashes -r dev-requirements.txt
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0", # coverage gate for wizard generators
  "ruff>=0.16",
  "black>=26.5",
  "mypy>=2.3.0",     # native_parser config requires 2.3.0 (PEP 758 support)
  "pylint>=4.0.7",
  "pre-commit>=3.5",
] # tests + linting
build = ["pyinstaller>=6.22.2", "Pillow>=9.0"] # Tcl/Tk 9 embedded-data support

[tool.hatch.build.targets.wheel]
packages = ["src/hoi4cm"]

# The repo root is on the path so tests can import the monolith; CI runs bare
# `pytest`, which (unlike `python -m pytest`) does not add the cwd itself.
[tool.pytest.ini_options]
pythonpath = ["src", ".", "scripts"]
testpaths = ["tests"]
# Plain `pytest` is headless. The Tk smoke runs alone: `xvfb-run -a pytest -m tk`.
addopts = "-m 'not tk'"
markers = ["tk: builds real Tk windows; needs a display and its own process"]

# CI measures the package and the root-level Tk shell in the headless suite, then
# applies independent coverage floors to each source tree. The wizard generator
# floor remains a separate targeted run (see docs/dev/wizards.md and issue #51).
[tool.coverage.run]
source = ["hoi4cm", "hoi4_content_maker"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "class .*\\(Protocol\\):",
  "@abstractmethod",
]
# Modules that build Tk widgets. The headless suite cannot reach their bodies,
# so they stay out of the package floor; tests/test_tk_smoke.py constructs them.
# Move logic out of one of these into a pure module to get it gated.
omit = [
  "src/hoi4cm/ui/canvas.py",
  "src/hoi4cm/ui/checklist.py",
  "src/hoi4cm/ui/effects_panel.py",
  "src/hoi4cm/ui/focus_list.py",
  "src/hoi4cm/ui/gfx_browser.py",
  "src/hoi4cm/ui/loaded_trees.py",
  "src/hoi4cm/ui/menubar.py",
  "src/hoi4cm/ui/mod_loading.py",
  "src/hoi4cm/ui/settings_dialog.py",
  "src/hoi4cm/ui/splash.py",
  "src/hoi4cm/ui/startup_check.py",
  "src/hoi4cm/ui/tasks.py",
  "src/hoi4cm/ui/thumbnail_grid.py",
  "src/hoi4cm/ui/toolbar.py",
  "src/hoi4cm/ui/focus_actions.py",
  "src/hoi4cm/ui/focus_spotlight.py",
  "src/hoi4cm/ui/tutorial.py",
  "src/hoi4cm/ui/widgets.py",
  "src/hoi4cm/wizards/_image_loader.py",
  "src/hoi4cm/wizards/_shared.py",
  "src/hoi4cm/wizards/additional_income.py",
  "src/hoi4cm/wizards/character.py",
  "src/hoi4cm/wizards/decision.py",
  "src/hoi4cm/wizards/dyn_mod.py",
  "src/hoi4cm/wizards/event.py",
  "src/hoi4cm/wizards/national_spirit.py",
  # Windows-only; the windows-permissions CI job covers it.
  "src/hoi4cm/mod/_cache_permissions.py",
]

# Build scripts are excluded from linting and formatting.
[tool.black]
line-length = 88
target-version = ["py314"]
extend-exclude = "^/build/"

[tool.ruff]
line-length = 88
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# Type checking is scoped to the modular package + tests. The monolith and
# build scripts stay out until they are refactored into the package. `mypy_path`
# puts src/ on the search path so tests can import hoi4cm.
[tool.mypy]
python_version = "3.14"
mypy_path = ["src", "scripts"]
files = ["src/hoi4cm", "tests", "scripts"]
native_parser = true
# The monolith and build scripts stay out until refactored. The native
# parser (above) handles PEP 758's unparenthesized `except A, B:` on 3.14,
# which the default parser could not (issue #68) — that is why those files
# no longer need excluding.
exclude = ["hoi4_content_maker.py", "build"]
warn_unused_configs = true

# Pillow is an optional extra and pytest is only a dev dependency; both may be
# absent when mypy runs, so treat their imports as untyped rather than failing.
[[tool.mypy.overrides]]
module = ["PIL.*", "pytest"]
ignore_missing_imports = true

# Pylint is a light gate on top of ruff/black. The disabled checks are either
# redundant with ruff/black (line length, f-strings, unused vars, reimports,
# dangerous defaults), too noisy for this codebase (naming, docstrings,
# too-many-*), or false positives on Tk/dataclass/mixin patterns (no-member,
# unused-argument on event callbacks, import-error on optional deps).
[tool.pylint]
max-line-length = 88
fail-under = 8.0
disable = [
  "C0103", # invalid-name
  "C0104", # disallowed-name
  "C0114", # missing-module-docstring
  "C0115", # missing-class-docstring
  "C0116", # missing-function-docstring
  "C0208", # use-sequence-for-iteration
  "C0209", # consider-using-f-string (ruff UP032)
  "C0301", # line-too-long (black)
  "C0302", # too-many-lines
  "C0325", # unnecessary-paren
  "C0415", # import-outside-top-level
  "C1803", # use-implicit-booleaness-not-comparison
  "C2801", # unnecessary-dunder-call
  "E0401", # import-error (optional deps)
  "E0601", # used-before-assignment (false positive on except blocks)
  "E0602", # undefined-variable (ruff F821)
  "E0603", # undefined-all-variable
  "E1101", # no-member (dataclass/mixin/Tk false positives)
  "R0402", # consider-using-from-import
  "R0801", # duplicate-code
  "R0901", # too-many-ancestors
  "R0902", # too-many-instance-attributes
  "R0903", # too-few-public-methods
  "R0904", # too-many-public-methods
  "R0911", # too-many-return-statements
  "R0912", # too-many-branches
  "R0913", # too-many-arguments
  "R0914", # too-many-locals
  "R0915", # too-many-statements
  "R0917", # too-many-positional-arguments
  "R1702", # too-many-nested-blocks
  "R1705", # no-else-return
  "R1716", # chained-comparison
  "R1735", # use-dict-literal
  "W0102", # dangerous-default-value (ruff B006)
  "W0104", # pointless-statement
  "W0108", # unnecessary-lambda
  "W0212", # protected-access
  "W0221", # arguments-differ
  "W0404", # reimported (ruff F811)
  "W0603", # global-statement
  "W0612", # unused-variable (ruff F841)
  "W0613", # unused-argument (Tk event callbacks)
  "W0621", # redefined-outer-name (pytest fixtures)
  "W0640", # cell-var-from-loop
  "W0718", # broad-exception-caught
]
